[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osun"
version = "0.2.0"
description = "Local-first Windows personal assistant shell with pluggable agent widgets"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
osun = "osun.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osun = ["web/*.html", "web/*.css", "web/*.js"]
osun_lights = ["web/*.html", "web/*.css", "web/*.js"]
