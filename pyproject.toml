[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osun-lights"
version = "0.1.0"
description = "Simulator-first Windows chat assistant for allowlisted Home Assistant lights"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
osun-lights = "osun_lights.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osun_lights = ["web/*.html", "web/*.css", "web/*.js"]
