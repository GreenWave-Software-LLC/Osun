name: Merge gate

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Compile Python
        run: python -m compileall -q src tests scripts
      - name: Run test suite with resource leaks fatal
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Validate browser JavaScript
        run: node --check src/osun/web/app.js
      - name: Verify clean patch formatting
        run: git show --check --format= HEAD

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-security.txt
      - name: Enforce repository security invariants
        run: python scripts/security_gate.py
      - name: Scan Python for security defects
        run: python -m bandit -q -r src -ll
      - name: Audit Python project dependencies
        run: python -m pip_audit --progress-spinner off .

  gate:
    name: Merge gate passed
    if: always()
    needs: [tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test and security job
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
